<a
  class="download-card"
  href="{{downloadUrl}}"
  download
  aria-label="{{#if ariaLabel}}{{ariaLabel}}{{else}}Скачать {{title}}, размер {{fileSize}}{{/if}}"
>
  <div class="download-card__content">
    <h3 class="download-card__title">{{title}}</h3>
    <p class="download-card__meta">{{fileSize}}</p>
  </div>

  <span
    class="download-card__button"
    aria-hidden="true"
  >
    <img
      class="download-card__icon"
      src="/icons/download.svg"
      width="24"
      height="24"
      alt=""
      aria-hidden="true"
    />
  </span>
</a>
