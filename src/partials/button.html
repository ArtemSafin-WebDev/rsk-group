<button
  class="button button--{{#if variant}}{{variant}}{{else}}grey{{/if}}{{#if size}} button--{{size}}{{/if}}{{#if fullWidth}} button--full-width{{/if}}"
  type="{{#if type}}{{type}}{{else}}button{{/if}}"
  {{#if disabled}}disabled{{/if}}
>
  {{#if icon}}
    <img class="button__icon" src="{{icon}}" width="24" height="24" alt="" aria-hidden="true" />
  {{/if}}
  <span class="button__label">{{label}}</span>
</button>
