<header class="site-header" data-initial-theme="{{headerTheme}}">
  <div class="container site-header__container">
    <div class="site-header__grid">
      <a class="site-header__logo" href="/" aria-label="РСК Групп — на главную">
        <img
          class="site-header__logo-image site-header__logo-image--light"
          src="/images/header/rsk-group-logo.webp"
          width="392"
          height="72"
          alt="РСК Групп"
        />
        <img
          class="site-header__logo-image site-header__logo-image--dark"
          src="/images/header/rsk-group-logo-dark.png"
          width="392"
          height="72"
          alt=""
          aria-hidden="true"
        />
      </a>

      <div class="site-header__navigation">
        <nav class="site-header__menu" aria-label="Основная навигация">
          <ul class="site-header__menu-list">
            {{#each headerNavigationItems}}
              <li class="site-header__menu-item">
                <a class="site-header__menu-link" href="{{url}}">{{label}}</a>
              </li>
            {{/each}}
          </ul>
        </nav>

        <div class="site-header__contacts">
          <a class="site-header__phone" href="tel:+79600796853">+ 7 960 079 68 53</a>

          <div class="site-header__actions">
            <button class="site-header__icon-button" type="button" aria-label="Поиск">
              <img src="/icons/search.svg" width="20" height="20" alt="" aria-hidden="true" />
            </button>

            <a class="site-header__icon-button" href="#materials" aria-label="Материалы">
              <img src="/icons/file-list.svg" width="20" height="20" alt="" aria-hidden="true" />
            </a>

            <button class="site-header__icon-button" type="button" aria-label="Открыть меню">
              <img src="/icons/menu.svg" width="20" height="20" alt="" aria-hidden="true" />
            </button>

            <a class="site-header__contact-button" href="#project-request">Связаться</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>
