<section class="subcategory-description" aria-label="О торшерных светильниках">
  <div class="container">
    <div class="subcategory-description__list">
      {{#each subcategoryDescriptions}}
        <article class="subcategory-description__item">
          <h2 class="subcategory-description__title">{{title}}</h2>
          <p class="subcategory-description__text">{{text}}</p>
        </article>
      {{/each}}
    </div>
  </div>
</section>
