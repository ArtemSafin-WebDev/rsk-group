<section class="hero-section" aria-labelledby="hero-title" data-hero-video>
  <div class="hero-section__media" aria-hidden="true">
    <picture class="hero-section__picture">
      <source
        media="(max-width: 576px)"
        srcset="/images/hero/background-mobile.webp"
        type="image/webp"
        width="720"
        height="1440"
      />
      <img
        class="hero-section__background"
        src="/images/hero/background-video-poster.webp"
        width="1920"
        height="1080"
        alt=""
      />
    </picture>

    <video
      class="hero-section__video"
      muted
      playsinline
      preload="none"
      tabindex="-1"
      data-hero-video-element
    >
      <source src="/videos/hero/day-night-scrub.mp4" type="video/mp4" />
    </video>
  </div>

  <div class="container">
    <div class="hero-section__grid">
      <div class="hero-section__lead">
        <h1 class="hero-section__title" id="hero-title">
          Пространство<br />
          начинается<br />
          со&nbsp;света
        </h1>

        {{> button
          label="Связаться"
          icon="/icons/chat-4-line.svg"
          variant="white"
        }}
      </div>

      <p class="hero-section__description">
        Производим световые продукты для российских условий эксплуатации —<br
          class="hero-section__description-mobile-break"
        />
        надёжные и&nbsp;эстетичные
      </p>

      <p class="hero-section__copyright">© 2016—2026</p>
    </div>
  </div>
</section>
